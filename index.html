<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Пеногенератор ПГ-600 — AR</title>
  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  <style>
    body { margin:0; font-family:Arial,sans-serif; background:#f3f3f3; }
    model-viewer { width:100vw; height:100vh; background:#f3f3f3; }
    .hint {
      position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
      background:white; padding:12px 18px; border-radius:12px;
      box-shadow:0 2px 12px #0002; text-align:center;
    }
  </style>
</head>
<body>
  <model-viewer
    src="pg_600.glb"
    ar
    ar-modes="scene-viewer webxr quick-look"
    camera-controls
    touch-action="pan-y"
    shadow-intensity="1"
    alt="Пеногенератор ПГ-600">
    <button slot="ar-button"
      style="position:fixed;left:50%;bottom:80px;transform:translateX(-50%);
             padding:14px 22px;border:0;border-radius:10px;
             background:#222;color:white;font-size:16px;">
      Открыть в AR
    </button>
  </model-viewer>
  <div class="hint">Сначала проверь модель в 3D, затем нажми «Открыть в AR».</div>
</body>
</html>
